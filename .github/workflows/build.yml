name: Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build OpenMFME.sln --configuration Release
      - run: dotnet run --project tests/OpenMFME.SmokeTests --configuration Release --no-build
